<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RSVP Count · Gyusoo &amp; Sehwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Gowun+Batang:wght@400;700&family=Montserrat:wght@400;600;700&display=swap">
<style>
  :root { --bg: #f7f3ea; --card: #fffdf8; --ink: #111827; --nv: #1b2a4a; --mu: #5b6475; --gold: #9c7a3f; --line: rgba(27,42,74,0.16); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #f7f3ea; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Gowun Batang", serif; word-break: keep-all; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
  .eyebrow { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold); text-align: center; margin: 0; font-size: 1.05rem; }
  h1 { text-align: center; font-weight: 400; color: var(--nv); font-size: 1.3rem; margin: 4px 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; box-shadow: 0 10px 28px rgba(27,42,74,0.06); }
  .login { max-width: 360px; margin: 0 auto; display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 0.82rem; color: var(--nv); }
  input { height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  .btn { height: 44px; border: 0; border-radius: 6px; background: var(--nv); color: #fff; font: inherit; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--nv); border: 1px solid var(--line); height: 38px; padding: 0 14px; }
  .note { font-size: 0.8rem; color: var(--mu); line-height: 1.7; margin: 0; }
  .err { color: #b42318; font-size: 0.82rem; min-height: 1.2em; margin: 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .k { font-family: "Montserrat"; font-size: 0.62rem; letter-spacing: 0.16em; color: var(--mu); text-transform: uppercase; }
  .kpi .v { font-family: "Cormorant Garamond", serif; font-size: 2rem; color: var(--nv); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 0.74rem; color: var(--mu); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 18px 0 10px; flex-wrap: wrap; }
  .bar h2 { font-size: 1rem; font-weight: 400; color: var(--nv); margin: 0; }
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 560px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-family: "Montserrat"; font-size: 0.62rem; letter-spacing: 0.14em; color: var(--mu); font-weight: 600; text-transform: uppercase; }
  td.n { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.74rem; }
  .tag.y { background: rgba(27,42,74,0.1); color: var(--nv); } .tag.n { background: rgba(180,35,24,0.08); color: #b42318; }
  .empty { padding: 26px; text-align: center; color: var(--mu); font-size: 0.86rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">R.S.V.P</p>
  <h1>참석 · 식사 집계</h1>

  <div class="card" id="setup" hidden>
    <p class="note">아직 Firebase가 연결되지 않았어요. <b>firebase-config.js</b>에 설정값을 넣으면 이 페이지에서 집계를 볼 수 있습니다.</p>
  </div>

  <form class="card login" id="login" hidden>
    <label>관리자 이메일<input id="em" type="email" autocomplete="username" required></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">들어가기</button>
    <p class="note">Firebase 콘솔에서 만든 관리자 계정으로만 볼 수 있습니다.</p>
  </form>

  <section id="dash" hidden>
    <div class="kpis">
      <div class="kpi"><div class="k">Replies</div><div class="v" id="kAll">0</div><div class="s">전체 회신</div></div>
      <div class="kpi"><div class="k">Attending</div><div class="v" id="kHead">0</div><div class="s">참석 인원 (<span id="kAttR">0</span>건)</div></div>
      <div class="kpi"><div class="k">Meals</div><div class="v" id="kMeal">0</div><div class="s">식사 인원 · 미정 <span id="kTbd">0</span>명</div></div>
      <div class="kpi"><div class="k">Not attending</div><div class="v" id="kNo">0</div><div class="s">미참석 회신</div></div>
    </div>
    <div class="bar">
      <h2>회신 목록</h2>
      <div style="display:flex;gap:8px"><button class="btn ghost" type="button" id="csv">CSV 내려받기</button><button class="btn ghost" type="button" id="out">로그아웃</button></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>시간</th><th>이름</th><th>휴대전화</th><th>참석</th><th>식사</th><th>인원</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var cfg = window.FIREBASE_CONFIG || {};
  if (!(cfg.apiKey && cfg.projectId && window.firebase)) { $('setup').hidden = false; return; }
  firebase.initializeApp(cfg);
  var auth = firebase.auth(), db = firebase.firestore(), unsub = null, data = [];
  function phone(p) { return String(p || '').replace(/(\d{3})(\d+)(\d{4})/, '$1-$2-$3'); }
  function when(ts) { if (!ts || !ts.toDate) return ''; var d = ts.toDate(); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
  function render() {
    var head = 0, meal = 0, tbd = 0, attR = 0, no = 0;
    data.forEach(function (v) {
      if (v.attend === '참석') { attR++; head += +v.count || 0; if (v.meal === '식사함') meal += +v.count || 0; else if (v.meal === '미정') tbd += +v.count || 0; }
      else no++;
    });
    $('kAll').textContent = data.length; $('kHead').textContent = head; $('kAttR').textContent = attR;
    $('kMeal').textContent = meal; $('kTbd').textContent = tbd; $('kNo').textContent = no;
    $('rows').innerHTML = data.length ? data.map(function (v) {
      var y = v.attend === '참석';
      return '<tr><td class="n">' + when(v.createdAt) + '</td><td>' + esc(v.name) + '</td><td class="n">' + phone(v.phone) + '</td><td><span class="tag ' + (y ? 'y' : 'n') + '">' + esc(v.attend) + '</span></td><td>' + esc(v.meal) + '</td><td class="n">' + (y ? (+v.count || 0) : '-') + '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty">아직 회신이 없어요.</td></tr>';
  }
  auth.onAuthStateChanged(function (u) {
    if (unsub) { unsub(); unsub = null; }
    $('login').hidden = !!u; $('dash').hidden = !u;
    if (!u) return;
    unsub = db.collection('passport_rsvp').orderBy('createdAt', 'desc').onSnapshot(function (snap) {
      data = snap.docs.map(function (d) { return d.data() || {}; }); render();
    }, function () { $('dash').hidden = true; $('login').hidden = false; $('err').textContent = '이 계정으로는 볼 수 없어요. 보안 규칙의 관리자 이메일을 확인해 주세요.'; });
  });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault(); $('err').textContent = '';
    auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value).catch(function () { $('err').textContent = '이메일 또는 비밀번호를 확인해 주세요.'; });
  });
  $('out').addEventListener('click', function () { auth.signOut(); });
  $('csv').addEventListener('click', function () {
    var lines = [['시간', '이름', '휴대전화', '참석', '식사', '인원']].concat(data.map(function (v) { return [when(v.createdAt), v.name, phone(v.phone), v.attend, v.meal, v.attend === '참석' ? v.count : 0]; }));
    var csv = '﻿' + lines.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'rsvp.csv'; a.click();
  });
})();
</script>
</body>
</html>
