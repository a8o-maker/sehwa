<style>
/* Layout: one-column app shell; a rubber ball mascot that squashes on mistakes and bounces back on hits */

  --ink: #12302B;
  --muted: #557069;
  --line: #C5DAD4;
  --ball: #FFB000;
  --ball-ink: #3A2600;
  --blue: #2563EB;
  --good: #14965B;
  --good-bg: #DDF5E8;
  --bad: #D93A3A;
  --bad-bg: #FDE3E3;
  --shadow: 0 2px 0 #C5DAD4;
  --f-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en: "Fredoka", "Jua", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1B19; --surface: #162926; --surface-2: #1F3733; --ink: #E6F2EF; --muted: #93ADA7;
    --line: #2C4843; --ball: #FFC23D; --ball-ink: #2A1B00; --blue: #6EA0FF; --good: #3DD68C; --good-bg: #133528;
    --bad: #FF7070; --bad-bg: #3A1A1A; --shadow: 0 2px 0 #08110F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1B19; --surface: #162926; --surface-2: #1F3733; --ink: #E6F2EF; --muted: #93ADA7;
  --line: #2C4843; --ball: #FFC23D; --ball-ink: #2A1B00; --blue: #6EA0FF; --good: #3DD68C; --good-bg: #133528;
  --bad: #FF7070; --bad-bg: #3A1A1A; --shadow: 0 2px 0 #08110F; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.en { font-family: var(--f-en); font-weight: 600; }

.top { display: flex; align-items: center; gap: 14px; }
.ballbox { width: 56px; height: 64px; position: relative; flex: none; }
.ball {

  background: radial-gradient(circle at 35% 30%, #FFE7A3 0 14%, var(--ball) 15% 100%);
  box-shadow: inset -5px -6px 0 rgba(0,0,0,.12); transform-origin: 50% 100%;
}
.ballbox::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 4px; border-radius: 4px; background: var(--line); }
.ball.hop { animation: hop .55s cubic-bezier(.3,.7,.4,1); }
.ball.squash { animation: squash .6s ease; }
@keyframes hop { 0%{transform:translateY(0) scale(1.15,.85)} 40%{transform:translateY(-20px) scale(.92,1.08)} 75%{transform:translateY(0) scale(1.12,.88)} 100%{transform:translateY(0) scale(1)} }

.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 1.6rem; line-height: 1.2; }
.brand p { margin: 0; color: var(--muted); font-size: .88rem; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--f-en); }

/* scope chips */
.label { font-size: .78rem; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .9rem;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.scope-title { margin-top: 10px; color: var(--muted); font-size: .9rem; min-height: 1.4em; }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s;
}
.mode:hover { transform: translateY(-2px); border-color: var(--ink); }
.mode:active { transform: translateY(1px); }
.mode .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-en); font-weight: 700; font-size: 1.1rem; }
.mode h3 { font-size: 1.2rem; }
.mode p { margin: 0; color: var(--muted); font-size: .88rem; }
.mode .best { font-size: .8rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.mode.feature { grid-column: 1 / -1; background: var(--ball); color: var(--ball-ink); border-color: var(--ball); box-shadow: 0 3px 0 #C98A00; }
.mode.feature p, .mode.feature .best { color: var(--ball-ink); opacity: .85; }
.mode.feature .ic { background: rgba(255,255,255,.45); }

.note { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; font-size: .88rem; color: var(--muted); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.linkbtn { background: none; border: none; padding: 0; color: var(--blue); text-decoration: underline; font-size: .88rem; }

.bar { display: flex; align-items: center; gap: 10px; }
.back { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 12px; }
.bar .title { font-family: var(--f-display); font-size: 1.25rem; flex: 1; min-width: 0; }
.hud { display: flex; gap: 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: flex-end; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; }

.progress { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.timer i { background: var(--blue); transition: none; }
.timer.low i { background: var(--bad); }

.card {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 28px 20px; text-align: center;

.q-word { font-family: var(--f-en); font-weight: 600; font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.15; overflow-wrap: anywhere; }

.pos { display: inline-block; font-size: .78rem; border-radius: 6px; padding: 1px 8px; background: var(--surface-2); color: var(--muted); letter-spacing: .04em; }
.hint { color: var(--muted); font-size: .88rem; }
.speak { background: var(--surface-2); border: none; border-radius: 999px; padding: 4px 12px; font-size: .85rem; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.choice {

.choice .k { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-en); font-size: .85rem; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.tile.sel { border-color: var(--blue); background: var(--surface-2); }
.tile.done { opacity: 0; transform: scale(.85); pointer-events: none; }
.tile.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }

.slots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-family: var(--f-en); font-size: 1.3rem; }
.slots span { min-width: 22px; border-bottom: 3px solid var(--line); text-align: center; line-height: 1.4; }
.slots span.sp { border-bottom-color: transparent; }
.slots span.shown { border-bottom-color: var(--ball); }
.answer { width: 100%; font-family: var(--f-en); font-size: 1.3rem; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-align: center; }
.answer.right { border-color: var(--good); background: var(--good-bg); }
.answer.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }

.missed { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px; }
.missed div { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.missed div:last-child { border-bottom: none; }
.missed .en { flex: 0 0 44%; min-width: 0; overflow-wrap: anywhere; }
.missed span:last-child { min-width: 0; }

.wordlist { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; max-height: 60vh; overflow: auto; }
.wordlist div { display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1.2fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wordlist div:last-child { border-bottom: none; }
.wordlist .mk { font-size: .78rem; color: var(--muted); white-space: nowrap; }

.wordlist .mk.k { color: var(--good); }

.foot { color: var(--muted); font-size: .8rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

// Build a deduplicated word bank; each section keeps references to its entries.
const BANK = new Map();
const SEC = SECTIONS.map(([en, ko, raw], i) => {
  const keys = [];
  raw.split("\n").forEach(line => {
    const [w, p, m] = line.split("|");
    const key = w + "|" + p + "|" + m;
    if (!BANK.has(key)) BANK.set(key, { key, w, p, m, sec: i + 1 });
    if (!keys.includes(key)) keys.push(key);
  });
  return { en, ko, keys };
});
const ALL = [...BANK.values()];

// ---- storage (per-viewer convenience only)
const STORE_KEY = "bounceback-ybm3-v1";
let S = { xp: 0, known: {}, wrong: {}, best: {} , scope: "all", mute: false };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} updateStats(); }
function updateStats() {
  document.getElementById("xp").textContent = S.xp;
  document.getElementById("known").textContent = Object.keys(S.known).filter(k => BANK.has(k)).length;
}
function markWrong(it) { S.wrong[it.key] = (S.wrong[it.key] || 0) + 1; delete S.known[it.key]; }
function markRight(it) { if (S.wrong[it.key]) { S.wrong[it.key]--; if (S.wrong[it.key] <= 0) delete S.wrong[it.key]; } }
function addXp(n) { S.xp += n; }

// ---- helpers
const $view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pool(scope = S.scope) {
  if (scope === "wrong") return ALL.filter(it => S.wrong[it.key]);
  if (scope === "all") return ALL;
  return SEC[scope - 1].keys.map(k => BANK.get(k));
}
const meanParts = m => m.split(",").map(s => s.trim());
function clash(a, b) {
  if (a.w === b.w) return true;
  const pa = meanParts(a.m), pb = meanParts(b.m);
  return pa.some(x => pb.includes(x));
}
function distractors(it, n) {
  const same = shuffle(ALL.filter(o => o.p === it.p && !clash(o, it)));
  const other = shuffle(ALL.filter(o => o.p !== it.p && !clash(o, it)));
  const out = [];
  for (const o of same.concat(other)) {
    if (out.length >= n) break;
    if (!out.some(x => clash(x, o))) out.push(o);
  }
  return out;
}

// sound + motion feedback
let actx = null;
function tone(freqs, dur = .09, type = "triangle") {
  if (S.mute) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .8;
    });
  } catch (e) {}
}
const ball = document.getElementById("ball");
function bounce(ok) {
  ball.classList.remove("hop", "squash"); void ball.offsetWidth;
  ball.classList.add(ok ? "hop" : "squash");
  ok ? tone([660, 880]) : tone([220, 160], .14, "sawtooth");
}
function pop(text, bad) {
  const d = document.createElement("div"); d.className = "pop" + (bad ? " bad" : ""); d.textContent = text;

}

    const u = new SpeechSynthesisUtterance(text.replace(/~|\(also\)|-ing/g, " ").replace(/\bA\b|\bB\b|\bV\b/g, "something"));
    u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u);

}

      if (left <= 0) answer(null);
    }, 50));
    const btns = [...$view.querySelectorAll(".choice")];
    function answer(key) {
      if (done) return; done = true; clearTimers();
      const left = Math.max(0, LIMIT - (performance.now() - start) / 1000);
      btns.forEach(b => { b.disabled = true; if (b.dataset.k === it.key) b.classList.add("right"); });
      if (key === it.key) {
        combo++; maxCombo = Math.max(maxCombo, combo); correct++;
        const gain = Math.round((100 + left * 10) * (1 + Math.min(combo - 1, 5) * .2));
        score += gain; addXp(10); markRight(it); bounce(true); pop("+" + gain);
      } else {
        combo = 0; missed.push(it); markWrong(it); bounce(false); pop(key ? "아쉬워요" : "시간 초과", true);
        const b = btns.find(b => b.dataset.k === key); if (b) b.classList.add("wrong");
      }
      save();
      timers.push(setTimeout(() => { i++; i < qs.length ? render() : finish(); }, key === it.key ? 700 : 1500));
    }
    btns.forEach(b => b.onclick = () => answer(b.dataset.k));
    keyHandler = e => { const n = +e.key; if (n >= 1 && n <= 4 && btns[n - 1]) answer(btns[n - 1].dataset.k); };
  }
  function finish() {
    const isBest = score > (S.best.quiz || 0); if (isBest) S.best.quiz = score;
    if (correct === qs.length) addXp(30);
    result("스피드 퀴즈", score + "점", `${qs.length}문제 중 ${correct}개 정답 · 최대 ${maxCombo} 콤보`, missed, quiz, isBest && score ? "최고 점수 갱신!" : "");
  }
  render();
}
let keyHandler = null;
document.addEventListener("keydown", e => { if (keyHandler && !(e.target && e.target.tagName === "INPUT")) keyHandler(e); });

// ---- MATCH
function match() {
  if (!needWords(5)) return;
  keyHandler = null;
  const ROUNDS = 3, PER = 5;
  let round = 0, t0 = performance.now(), penalty = 0, mistakes = 0; const missed = [];
  const bag = shuffle(pool());
  function pick() {
    const out = [];
    for (const it of bag) { if (out.length >= PER) break; if (!out.some(o => clash(o, it))) out.push(it); }
    out.forEach(o => bag.splice(bag.indexOf(o), 1));
    if (out.length < PER) { for (const it of shuffle(pool())) { if (out.length >= PER) break; if (!out.some(o => clash(o, it))) out.push(it); } }
    return out;
  }
  function render() {
    clearTimers();
    const set = pick(); let left = set.length, selL = null, selR = null;
    $view.innerHTML = `${bar("짝맞추기", `<span class="pill">라운드 ${round + 1} / ${ROUNDS}</span><span class="pill" id="clock">0.0초</span>`)}
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
      <p class="hint" style="margin:0">왼쪽 영어와 오른쪽 뜻을 하나씩 눌러 짝을 맞추세요. 틀리면 3초가 더해져요.</p>
      <div class="match">
        <div class="col">${shuffle(set).map(o => `<button class="tile en" data-k="${o.key}" data-side="L">${esc(o.w)}</button>`).join("")}</div>
        <div class="col">${shuffle(set).map(o => `<button class="tile" data-k="${o.key}" data-side="R">${esc(o.m)}</button>`).join("")}</div>
      </div>
    </div>`;
    bindBack();
    const clock = document.getElementById("clock");
    timers.push(setInterval(() => { clock.textContent = ((performance.now() - t0) / 1000 + penalty).toFixed(1) + "초"; }, 100));
    $view.querySelectorAll(".tile").forEach(t => t.onclick = () => {
      if (t.dataset.side === "L") { if (selL) selL.classList.remove("sel"); selL = t; speak(t.textContent); } else { if (selR) selR.classList.remove("sel"); selR = t; }
      t.classList.add("sel");
      if (selL && selR) {
        const a = selL, b = selR; selL = selR = null;
        if (a.dataset.k === b.dataset.k) {
          a.classList.add("done"); b.classList.add("done"); bounce(true); addXp(5);
          if (--left === 0) { round++; timers.push(setTimeout(() => round < ROUNDS ? render() : finish(), 450)); }
        } else {
          penalty += 3; mistakes++; bounce(false); pop("+3초", true);
          const it = BANK.get(a.dataset.k); if (!missed.includes(it)) { missed.push(it); markWrong(it); }
          [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong"); setTimeout(() => x.classList.remove("wrong"), 400); });
        }
        save();
      }
    });
  }
  function finish() {
    const total = (performance.now() - t0) / 1000 + penalty;
    const isBest = !S.best.match || total < S.best.match; if (isBest) S.best.match = total;
    addXp(20);
    result("짝맞추기", total.toFixed(1) + "초", `${ROUNDS * PER}쌍 완료 · 실수 ${mistakes}번`, missed, match, isBest ? "최고 기록 갱신!" : "");
  }
  render();
}

// ---- SPELL
const spellAnswer = it => it.w.replace(/\s*~\s*/g, " ").replace(/\s+/g, " ").trim();
const spellable = it => !/\b[ABV]\b|-ing|\(also\)/.test(it.w) && /^[a-zA-Z' -]+$/.test(spellAnswer(it));
const norm = s => s.toLowerCase().replace(/[^a-z' -]/g, "").replace(/\s+/g, " ").trim();
function spell() {
  const src = pool().filter(spellable);
  if (src.length < 3) {
    $view.innerHTML = `${bar("철자 바운스")}<div class="card" style="margin-top:16px"><p>이 범위에는 철자로 쓸 수 있는 단어가 부족해요. 다른 범위를 골라 주세요.</p></div>`;
    bindBack(); return;
  }
  keyHandler = null;
  const qs = shuffle(src).slice(0, 10);
  let i = 0, score = 0, lives = 3, correct = 0; const missed = [];
  function render() {
    clearTimers();
    const it = qs[i], ans = spellAnswer(it); let hints = 0, tries = 0, done = false;
    const hearts = "●".repeat(lives) + "○".repeat(3 - lives);
    $view.innerHTML = `${bar("철자 바운스", `<span class="pill">${i + 1} / ${qs.length}</span><span class="pill">${score}점</span><span class="pill" aria-label="남은 공 ${lives}개" style="color:var(--ball)">${hearts}</span>`)}
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
      <div class="progress"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card">
        <span class="pos">${POS[it.p]}</span>
        <div class="q-mean">${esc(it.m)}</div>
        <div class="slots" id="slots"></div>
      </div>
      <form id="f" style="display:flex;flex-direction:column;gap:10px">
        <input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰기" aria-label="영어 철자 입력">
        <div class="row">
          <button type="button" class="btn" id="hintb">힌트 (한 글자)</button>
          <button type="submit" class="btn primary" id="ok">확인</button>
        </div>
      </form>
      <div class="reveal" id="rv"></div>
    </div>`;
    bindBack();
    const slots = document.getElementById("slots"), inp = document.getElementById("ans"), rv = document.getElementById("rv");
    const drawSlots = (all) => {
      let letterIdx = 0;
      slots.innerHTML = [...ans].map(ch => {
        if (ch === " ") return `<span class="sp"> </span>`;
        const show = all || letterIdx < hints; letterIdx++;
        return `<span class="${show ? "shown" : ""}">${show ? esc(ch) : "&nbsp;"}</span>`;
      }).join("");
    };
    drawSlots(false); inp.focus();
    document.getElementById("hintb").onclick = () => {
      const letters = ans.replace(/ /g, "").length;
      if (hints < letters - 1) { hints++; drawSlots(false); tone([520]); }
      inp.focus();
    };
    document.getElementById("f").onsubmit = e => {
      e.preventDefault(); if (done) return;
      const v = norm(inp.value); if (!v) return;
      if (v === norm(ans)) {
        done = true; correct++;
        const gain = Math.max(20, 100 - hints * 20 - tries * 30);
        score += gain; addXp(12); markRight(it); bounce(true); pop("+" + gain);
        inp.classList.add("right"); drawSlots(true); speak(ans);
        rv.innerHTML = `정답! <b>${esc(it.w)}</b>`;
        save(); timers.push(setTimeout(next, 1100));
      } else {
        tries++; bounce(false);
        inp.classList.remove("wrong"); void inp.offsetWidth; inp.classList.add("wrong");
        if (tries >= 2) {
          done = true; lives--; missed.push(it); markWrong(it); drawSlots(true);
          rv.innerHTML = `정답은 <b>${esc(it.w)}</b> · 공 하나를 잃었어요`; speak(ans);
          save(); timers.push(setTimeout(next, 2000));
        } else {
          hints = Math.max(hints, 1); drawSlots(false);
          rv.textContent = "한 번 더! 첫 글자를 보여 줄게요."; inp.select();
        }
      }
    };
  }
  function next() { i++; (i < qs.length && lives > 0) ? render() : finish(); }
  function finish() {
    const isBest = score > (S.best.spell || 0); if (isBest) S.best.spell = score;
    result("철자 바운스", score + "점", lives > 0 ? `${qs.length}문제 중 ${correct}개 정답` : `공을 모두 잃었어요 · ${correct}개 정답`, missed, spell, isBest && score ? "최고 점수 갱신!" : "");
  }
  render();
}

// ---- FLASHCARDS
function flash() {
  if (!needWords(1)) return;
  let deck = shuffle(pool()), i = 0, knownN = 0;
  function render() {
    clearTimers();
    if (i >= deck.length) {
      $view.innerHTML = `${bar("플래시카드")}<section class="result" style="margin-top:20px"><div class="big">${knownN} / ${deck.length}</div><div>이번에 안다고 표시한 단어</div>
      <div class="row" style="width:100%"><button class="btn primary" id="again">처음부터 다시</button><button class="btn" id="q">스피드 퀴즈로 확인</button></div></section>`;
      bindBack(); document.getElementById("again").onclick = flash; document.getElementById("q").onclick = quiz; return;
    }
    const it = deck[i];
    $view.innerHTML = `${bar("플래시카드", `<span class="pill">${i + 1} / ${deck.length}</span>`)}
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">
      <div class="progress"><i style="width:${i / deck.length * 100}%"></i></div>
      <button class="flip" id="fc" aria-label="카드 뒤집기">
        <div class="flip-inner">
          <div class="face card"><span class="pos">${POS[it.p]}</span><div class="q-word">${esc(it.w)}</div><div class="hint">눌러서 뜻 보기 · 스페이스</div></div>
          <div class="face card back-face"><div class="q-mean">${esc(it.m)}</div><div class="hint en">${esc(it.w)}</div></div>
        </div>
      </button>
      <div class="row">
        <button class="btn bad" id="no">몰라요 ←</button>
        <button class="btn" id="sp">발음 듣기</button>
        <button class="btn good" id="yes">알아요 →</button>
      </div>
    </div>`;
    bindBack();
    const fc = document.getElementById("fc");
    fc.onclick = () => fc.classList.toggle("on");
    document.getElementById("sp").onclick = () => speak(it.w);
    const no = () => { markWrong(it); bounce(false); save(); i++; render(); };
    const yes = () => { S.known[it.key] = 1; markRight(it); addXp(2); knownN++; bounce(true); save(); i++; render(); };
    document.getElementById("no").onclick = no;
    document.getElementById("yes").onclick = yes;
    keyHandler = e => {
      if (e.key === " ") { e.preventDefault(); fc.classList.toggle("on"); }
      else if (e.key === "ArrowLeft") no(); else if (e.key === "ArrowRight") yes();
    };
  }
  render();
}

// ---- LIST
function list() {
  keyHandler = null;
  const items = pool();
  $view.innerHTML = `${bar("단어 목록", `<span class="pill">${items.length}단어</span>`)}
  <p class="hint">${esc(scopeName())} · 영어를 누르면 발음이 나와요.</p>
  <div class="wordlist">${items.map(it => `<div><button class="linkbtn en" style="text-align:left;color:var(--ink);text-decoration:none" data-w="${esc(it.w)}">${esc(it.w)}</button><span class="pos">${it.p}</span><span>${esc(it.m)}</span><span class="mk ${S.wrong[it.key] ? "w" : S.known[it.key] ? "k" : ""}">${S.wrong[it.key] ? "오답 " + S.wrong[it.key] : S.known[it.key] ? "외움" : ""}</span></div>`).join("")}</div>`;
  bindBack();
  $view.querySelectorAll("[data-w]").forEach(b => b.onclick = () => speak(b.dataset.w));
}

const _home = home;
home = function () { keyHandler = null; _home(); };
home();
</script>
